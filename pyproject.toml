[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-trick-client"
version = "0.14.0"
description = "Privacy-preserving local token usage collector for Token Trick"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "coding-agent-sessions @ https://agent-telemetry.aisloppy.com/downloads/coding_agent_sessions-0.8.2.tar.gz#sha256=d6531b79648a2b32352c2c70d57b711a44ab37ae4105f41ea54df6312d8b7373",
]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tokentrick.com"
Repository = "https://github.com/QualityCopperShovel/token-trick-client"
Issues = "https://github.com/QualityCopperShovel/token-trick-client/issues"

[project.scripts]
token-trick = "token_trick_client.cli:main"

[tool.setuptools]
packages = ["token_trick_client"]
package-dir = {"" = "src"}
