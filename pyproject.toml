[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-trick-client"
version = "0.16.0"
description = "Privacy-preserving local token usage collector for Token Trick"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "coding-agent-sessions @ https://agent-telemetry.aisloppy.com/downloads/coding_agent_sessions-0.8.3.tar.gz#sha256=2151aefb03d808d4331a93ac080f6976487fd44d0e21e6f835cd9a45c62e28b3",
]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tokentrick.com"
Repository = "https://github.com/QualityCopperShovel/token-trick-client"
Issues = "https://github.com/QualityCopperShovel/token-trick-client/issues"

[project.scripts]
token-trick = "token_trick_client.cli:main"

[tool.setuptools]
packages = ["token_trick_client"]
package-dir = {"" = "src"}
