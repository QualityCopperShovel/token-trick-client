[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-trick-client"
version = "0.3.0"
description = "Privacy-preserving local token usage collector for Token Trick"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "coding-agent-sessions @ https://agent-telemetry.aisloppy.com/downloads/coding_agent_sessions-0.1.0.tar.gz#sha256=5b971b3742b8f0fe6ef5e3bacfff76fa469b5ce1cf7b2b7b7a5e782e2a65d257",
]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tokentrick.com"
Repository = "https://github.com/QualityCopperShovel/token-trick-client"
Issues = "https://github.com/QualityCopperShovel/token-trick-client/issues"

[project.scripts]
token-trick = "token_trick_client.cli:main"

[tool.setuptools]
packages = ["token_trick_client"]
package-dir = {"" = "src"}
