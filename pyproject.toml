[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-trick-client"
version = "0.2.0"
description = "Privacy-preserving local token usage collector for Token Trick"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://tokentrick.com"
Repository = "https://github.com/QualityCopperShovel/token-trick-client"
Issues = "https://github.com/QualityCopperShovel/token-trick-client/issues"

[project.scripts]
token-trick = "token_trick_client.cli:main"

[tool.setuptools]
packages = ["token_trick_client"]
package-dir = {"" = "src"}
